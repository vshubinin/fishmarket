<!doctype html>
<html lang="en" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Best fish</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .image-container {
            position: relative;
            display: inline-block;
        }

        .image-container img {
            transition: transform 0.3s ease;
            width: 100px;
        }

        .image-container:hover img {
            transform: scale(4);
            z-index: 10;
            position: relative;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 class="text-center my-4">Товары на продажу</h1>
    <div class="mb-3 text-center">
        <div sec:authorize="isAuthenticated()">
            <span>Вы вошли как <strong th:text="${#authentication.name}">user</strong></span>
            <a class="btn btn-outline-secondary ms-2" th:href="@{/logout}">Выйти</a>
            <a class="btn btn-outline-secondary ms-2" sec:authorize="hasRole('ADMIN')" href="/admin/users">Админка</a>
        </div>
    </div>
    <div sec:authorize="hasRole('ADMIN')">
        <a class="btn btn-success" href="/fish/create">Добавить товар</a>
    </div>
    <div sec:authorize="hasAnyRole('USER','ADMIN')">
        <table class="table">
            <thead>
            <tr>
                <th>#</th>
                <th>Товар</th>
                <th>Цена</th>
                <th>Дата</th>
                <th sec:authorize="hasRole('ADMIN')">Фото</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="fish : ${fishlist}">
                <td th:text="${fish.id}"></td>
                <td th:text="${fish.name}"></td>
                <td th:text="${fish.price} + '₴'"></td>
                <td th:text="${fish.catchDate.toString().substring(0,10)}"></td>
                <td>
                    <div sec:authorize="hasRole('ADMIN')">
                        <div class="slider-container">
                            <img th:each="img : ${fish.images}"
                                 th:src="@{'/images/' + ${img.fileName}}"
                                 width="150"
                                 alt="Фото товару">
                        </div>
                    </div>
                </td>
                <td>
                    <div sec:authorize="hasRole('ADMIN')">
                        <a class="btn btn-danger btn-sm" th:href="@{/fish/delete(id=${fish.id})}"
                           onclick="return confirm('Ви впевнені?')">Удалить</a>
                        <a class="btn btn-secondary btn-sm ms-2" th:href="@{/fish/edit(id=${fish.id})}">Редактировать</a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div sec:authorize="!isAuthenticated()" class="alert alert-info">
        <p>Товары доступные только зарегестрированным пользователям. Пожалуйста, войдите или обратитесь к админу.</p>
        <a class="btn btn-primary" href="/login">Войти</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous">
</script>
</body>
</html>
